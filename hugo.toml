# Hugo Site Configuration
# Theme: PaperMod (git submodule)
#
# Identity: the single source of truth for name, role, profiles, and
# structured data lives in data/identity.yaml. params.author below mirrors
# its displayName; the Person JSON-LD in layouts/partials/extend_head.html
# is generated from that file. Change identity data there, not here.
baseURL = "https://ejaramillo1.github.io/My-AI-Journey/"
languageCode = "en-us"
title = "My AI Journey"
theme = "PaperMod"

enableEmoji = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "ROBOTS"]

[params]
  # Display name — mirrors displayName in data/identity.yaml.
  author = "Eduardo Jaramillo"
  description = "Eduardo Jaramillo, Research Engineer (Agentic Platforms) at Teradata — agent memory, evaluation, observability. Building AI agents, learning in public."
  keywords = ["Eduardo Jaramillo", "Agent Memory", "AI Agents", "LLM Evaluation", "Agent Observability", "Agentic AI", "Loom", "Teradata", "Economist"]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  DateFormat = "January 2, 2006"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/ejaramillo1"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/jose-eduardo-jaramillo"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:ejaramillobarrera@gmail.com"
  [[params.socialIcons]]
    name = "medium"
    url = "https://medium.com/@ejaramillobarrera"
  [[params.socialIcons]]
    name = "orcid"
    url = "https://orcid.org/0009-0002-0889-4830"
  [[params.socialIcons]]
    name = "substack"
    url = "https://edjaramilloaijourney.substack.com"

  # Phase III-A item A5, revised per ChatGPT review
  # (CGPT-MAJ-REVIEW-001-RESP): the homepage Organization block (PaperMod
  # schema) describes the site/publication "My AI Journey", and sameAs
  # asserts the SAME entity, not its founder/author. So Organization
  # sameAs holds only URLs that are the publication itself under another
  # address: the Substack publication URL (the same publication, hosted
  # on Substack). The four personal profiles (GitHub, LinkedIn, Medium
  # author profile, ORCID) describe Eduardo the person, not the
  # publication — they belong only in Person sameAs
  # (data/identity.yaml). The mailto: contact is a contact method, not
  # an identity profile, and the Teradata Labs Medium publication is a
  # different publication, so neither qualifies. Without this list
  # PaperMod builds sameAs from the socialIcons above, personal profiles
  # and mailto: included.
  [params.schema]
    sameAs = [
      "https://edjaramilloaijourney.substack.com",
    ]

  [params.footer]
    text = "Economist by training. Agent researcher by craft."

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

DefaultContentLanguage = "en"

[languages]
  [languages.en]
    languageName = "English"
    contentDir = "content/en"
    weight = 1
    title = "My AI Journey"
    [languages.en.params]
      description = "Eduardo Jaramillo, Research Engineer (Agentic Platforms) at Teradata — agent memory, evaluation, observability. Building AI agents, learning in public"
    # Menu labels are per-language (REVIEW-059): the global menu showed
    # the English "Certificates" label on the Spanish site too.
    [[languages.en.menu.main]]
      name = "Blog"
      pageRef = "/posts"
      weight = 10
    [[languages.en.menu.main]]
      name = "About"
      pageRef = "/about"
      weight = 20
    [[languages.en.menu.main]]
      name = "Certificates"
      pageRef = "/certificates"
      weight = 30

  [languages.es]
    languageName = "Español"
    contentDir = "content/es"
    weight = 2
    title = "My AI Journey"
    [languages.es.params]
      description = "Eduardo Jaramillo, Ingeniero de Investigación en Teradata — memoria de agentes, evaluación y observabilidad. Construyendo agentes de IA y aprendiendo en público"
    [[languages.es.menu.main]]
      name = "Blog"
      pageRef = "/posts"
      weight = 10
    [[languages.es.menu.main]]
      name = "About"
      pageRef = "/about"
      weight = 20
    [[languages.es.menu.main]]
      name = "Certificados"
      pageRef = "/certificates"
      weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
