# Hugo Site Configuration
# Theme: PaperMod (git submodule)
baseURL = "https://ejaramillo1.github.io/My-AI-Journey/"
languageCode = "en-us"
title = "My AI Journey"
theme = "PaperMod"

enableEmoji = true

[pagination]
  pagerSize = 10

[params]
  author = "Ed Jaramillo"
  description = "Building AI agents, automating workflows, and learning in public."
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  DateFormat = "January 2, 2006"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/ejaramillo1"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/jose-eduardo-jaramillo"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:ejaramillobarrera@gmail.com"

  [params.footer]
    text = "Economist by training. Agent researcher by craft."

  [params.homeInfoParams]
    Title = "Hi, I'm Ed 👋"
    Tagline = "Economist by training. Agent researcher by craft."
    Content = """
I'm learning to build AI agents and automate my life — one install at a time. This is my public journal: honest notes on self-hosted agents, token economics, and the systems that run my life.
    """

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

DefaultContentLanguage = "en"

[languages]
  [languages.en]
    languageName = "English"
    contentDir = "content/en"
    weight = 1
    title = "My AI Journey"
    [languages.en.params]
      description = "Building AI agents, automating workflows, and learning in public"

  [languages.es]
    languageName = "Español"
    contentDir = "content/es"
    weight = 2
    title = "My AI Journey"
    [languages.es.params]
      description = "Construyendo agentes de IA, automatizando workflows y aprendiendo en público"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menu.main]]
  name = "Blog"
  pageRef = "/posts"
  weight = 10
[[menu.main]]
  name = "About"
  pageRef = "/about"
  weight = 20
